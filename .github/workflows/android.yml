name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        working-directory: android
        run: cp app/build/outputs/apk/debug/app-debug.apk MHOP-1.0.0-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MHOP-1.0.0-debug-apk
          path: android/MHOP-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
