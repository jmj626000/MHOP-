name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename + verify
        working-directory: android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MHOP-1.1.0-debug.apk
          ls -l MHOP-1.1.0-debug.apk
          unzip -l MHOP-1.1.0-debug.apk | grep -E 'classes.dex|AndroidManifest.xml|resources.arsc'

      - uses: actions/upload-artifact@v4
        with:
          name: MHOP-1.1.0-debug-apk
          path: android/MHOP-1.1.0-debug.apk
          retention-days: 30

  build-release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject release signing
        working-directory: android
        run: |
          set -e
          base64 -d > /tmp/mhop-release.keystore <<< "${{ secrets.MHOP_RELEASE_KEYSTORE_BASE64 }}"
          ls -la /tmp/mhop-release.keystore
          file /tmp/mhop-release.keystore
          keytool -list -keystore /tmp/mhop-release.keystore \
            -storepass "${{ secrets.MHOP_RELEASE_STORE_PASSWORD }}" \
            -alias "${{ secrets.MHOP_RELEASE_KEY_ALIAS }}" -v | head -15

      - name: Build release APK
        working-directory: android
        env:
          MHOP_STOREPW: ${{ secrets.MHOP_RELEASE_STORE_PASSWORD }}
          MHOP_ALIAS: ${{ secrets.MHOP_RELEASE_KEY_ALIAS }}
          MHOP_KEYPW: ${{ secrets.MHOP_RELEASE_KEY_PASSWORD }}
        run: |
          # Write project-level gradle.properties (Gradle auto-loads it)
          cat > gradle.properties <<GRADLE_EOF
          MHOP_RELEASE_STORE_FILE=/tmp/mhop-release.keystore
          MHOP_RELEASE_STORE_PASSWORD=$ENV{MHOP_STOREPW}
          MHOP_RELEASE_KEY_ALIAS=$ENV{MHOP_ALIAS}
          MHOP_RELEASE_KEY_PASSWORD=$ENV{MHOP_KEYPW}
          GRADLE_EOF
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename + verify
        working-directory: android
        run: |
          cp app/build/outputs/apk/release/app-release.apk MHOP-1.1.0-release.apk
          ls -l MHOP-1.1.0-release.apk
          unzip -l MHOP-1.1.0-release.apk | grep -E 'classes.dex|AndroidManifest.xml|resources.arsc'
          (apksigner verify --verbose --print-certs MHOP-1.1.0-release.apk 2>&1 || true) | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: MHOP-1.1.0-release-apk
          path: android/MHOP-1.1.0-release.apk
          retention-days: 90
