name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端构建 (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建
        working-directory: frontend
        run: npm run build

  backend:
    name: 后端检查 (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt
      - name: 语法编译
        working-directory: backend
        run: python -m compileall -q app
      - name: 应用可导入性检查
        working-directory: backend
        run: python -c "from app.main import app; print('routes:', len(app.routes))"

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建部署镜像
        run: docker build -t mhop:ci .
      - name: 镜像内健康检查
        run: |
          docker run -d --name mhop -p 8000:8000 mhop:ci
          sleep 8
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="app">'
          docker logs mhop | tail -n 20
