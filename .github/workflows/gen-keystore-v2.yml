name: Gen Keystore v2 (auto password)

on:
  workflow_dispatch:

jobs:
  gen:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore (random password, store=key)
        run: |
          set -euo pipefail
          ALIAS=mhop
          # 24-char random password; SAME for store and key -> no mismatch possible
          PW=$(openssl rand -hex 18)
          keytool -genkeypair -v \
            -dname "CN=mhop, OU=MHOP, O=MHOP, L=Beijing, ST=Beijing, C=CN" \
            -keystore mhop-release.keystore \
            -storepass "$PW" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -keypass "$PW"
          base64 -w0 mhop-release.keystore > mhop-release.keystore.base64
          printf 'ALIAS=%s\nSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' "$ALIAS" "$PW" "$PW" > credentials.txt
          # Self-check: must be readable with the generated password
          keytool -list -keystore mhop-release.keystore -storepass "$PW" -alias "$ALIAS"
          echo '[OK] keystore generated and verified'
          ls -la mhop-release.keystore mhop-release.keystore.base64 credentials.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mhop-release-keystore-v2
          path: |
            mhop-release.keystore
            mhop-release.keystore.base64
            credentials.txt
          if-no-files-found: error
          retention-days: 7
