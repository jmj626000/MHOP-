name: 生成 Release Keystore（一次性）

# ⚠️ 敏感产物：本 workflow 跑完后请立即下载 artifact，把 keystore 备份到安全位置、base64 粘进 Secret，然后删除本 workflow 文件。
# 不要保留 keystore 在 GitHub 上超过 7 天。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: keystore 别名（以后配置 Secret 用）
        required: true
        default: mhop
      store_password:
        description: keystore 文件密码（至少 6 位，务必记牢，丢了就无法升级）
        required: true
      key_password:
        description: alias 密码（留空则和 store_password 相同）
        required: false
        default: ''
      validity:
        description: 有效期（天），默认 100 年
        required: false
        default: '36500'
      organization:
        description: 组织（keytool 交互参数，随便填）
        required: false
        default: MHOP

jobs:
  generate-keystore:
    name: 生成 keystore + base64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成 keystore
        shell: bash
        run: |
          ALIAS="${{ inputs.alias }}"
          STORE_PW="${{ inputs.store_password }}"
          KEY_PW="${{ inputs.key_password }}"
          [ -z "$KEY_PW" ] && KEY_PW="$STORE_PW"
          VALIDITY="${{ inputs.validity }}"
          ORG="${{ inputs.organization }}"

          echo "[*] Generating keystore alias=$ALIAS validity=$VALIDITY days"
          # -storepass / -keypass 走参数，不 echo；交互参数一次性答完
          keytool -genkeypair \
            -v \
            -dname "CN=$ALIAS, OU=$ORG, O=$ORG, L=Beijing, ST=Beijing, C=CN" \
            -keystore mhop-release.keystore \
            -storepass "$STORE_PW" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY" \
            -keypass "$KEY_PW"

          echo "[*] Verify entry exists"
          keytool -list -keystore mhop-release.keystore -storepass "$STORE_PW" | grep -A2 "$ALIAS"

          echo "[*] keystore size (bytes):"
          ls -l mhop-release.keystore

      - name: 导出 base64
        shell: bash
        run: |
          # 纯 base64，无 PEM 包裹行，直接粘进 GitHub Secret 就能用
          base64 -w0 mhop-release.keystore > mhop-release.keystore.base64
          echo "[*] base64 length: $(wc -c < mhop-release.keystore.base64)"

      - name: 打包下载 artifact（⚠️ 下载后立刻从 GitHub 删除）
        uses: actions/upload-artifact@v4
        with:
          name: mhop-release-keystore
          path: |
            mhop-release.keystore
            mhop-release.keystore.base64
          if-no-files-found: error
          # 7 天后 GitHub 自动清理，不要长期留着
          retention-days: 7
