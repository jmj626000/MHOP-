plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cldery.mhop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cldery.mhop'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // 使用默认 debug 签名，CI 可直接产出可安装 APK
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// 纯框架实现（android.* / android.webkit.*），无第三方依赖
dependencies {
}
