plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cldery.mhop'
    compileSdk 35

    signingConfigs {
        // Release 签名：CI 在 android/gradle.properties 写入这 4 个属性
        // Gradle 自动加载 project gradle.properties，findProperty() 能读到
        release {
            def sf = project.findProperty('MHOP_RELEASE_STORE_FILE')
            if (sf) {
                storeFile file(sf)
                storePassword project.findProperty('MHOP_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MHOP_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MHOP_RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.cldery.mhop'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // 默认 debug 签名，CI 可直接产出可安装 APK
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// 纯框架实现（android.* / android.webkit.*），无第三方依赖
dependencies {
}
