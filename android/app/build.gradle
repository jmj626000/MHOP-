plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cldery.mhop'
    compileSdk 35

    signingConfigs {
        // Release 签名从 project properties 读取（CI 在 runner gradle.properties 写入）。
        // 本地未注入时 release 无签名 → assembleRelease 会报错（安全：不会生成未签名 APK）。
        release {
            def storeFileStr = project.findProperty('MHOP_RELEASE_STORE_FILE') as String
            if (storeFileStr) {
                storeFile file(storeFileStr)
                storePassword project.findProperty('MHOP_RELEASE_STORE_PASSWORD') as String
                keyAlias project.findProperty('MHOP_RELEASE_KEY_ALIAS') as String
                keyPassword project.findProperty('MHOP_RELEASE_KEY_PASSWORD') as String
            }
        }
    }

    defaultConfig {
        applicationId 'com.cldery.mhop'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // 默认 debug 签名，CI 可直接产出可安装 APK
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// 纯框架实现（android.* / android.webkit.*），无第三方依赖
dependencies {
}
