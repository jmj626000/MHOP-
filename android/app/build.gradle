plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cldery.mhop'
    compileSdk 35

    signingConfigs {
        // Release 签名：优先读 -P 参数 / ORG_GRADLE_PROJECT_ 环境变量 / project gradle.properties
        // Groovy 属性访问语法 `project.XXX` 会被 Gradle 属性解析器解析（含环境变量映射）
        release {
            def sf = project.MHOP_RELEASE_STORE_FILE
            if (sf) {
                storeFile file(sf)
                storePassword project.MHOP_RELEASE_STORE_PASSWORD
                keyAlias project.MHOP_RELEASE_KEY_ALIAS
                keyPassword project.MHOP_RELEASE_KEY_PASSWORD
            }
        }
    }

    defaultConfig {
        applicationId 'com.cldery.mhop'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // 默认 debug 签名，CI 可直接产出可安装 APK
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// 纯框架实现（android.* / android.webkit.*），无第三方依赖
dependencies {
}
